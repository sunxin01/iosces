<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拾光 - 交互原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #FF8C4D;
    --secondary: #FFC78C;
    --bg: #FAF7F2;
    --card: #FFFFFF;
    --text: #2E2924;
    --subtext: #8C857A;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #e8e4dd;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 10px #1a1a1a;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    font-size: 15px; font-weight: 600; color: var(--text);
    flex-shrink: 0;
  }
  .navbar {
    padding: 8px 20px 14px;
    flex-shrink: 0;
  }
  .navbar h1 { font-size: 32px; font-weight: 700; color: var(--text); }
  .content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 16px 130px;
    position: relative;
  }
  .content::-webkit-scrollbar { display: none; }
  .card {
    background: var(--card);
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .card:active { transform: scale(0.98); }
  .card .img {
    height: 180px;
    background: linear-gradient(135deg, #FFB380, #FF8C9F);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 56px;
  }
  .card .body { padding: 14px 16px; }
  .card .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .card h3 { font-size: 17px; font-weight: 600; color: var(--text); flex: 1; margin-right: 12px; }
  .card .emoji { font-size: 28px; }
  .card .meta { font-size: 12px; color: var(--subtext); margin-bottom: 6px; }
  .card .note { font-size: 14px; color: #4a453f; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 84px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.06);
    display: flex;
    padding-bottom: 18px;
    z-index: 10;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--subtext);
    cursor: pointer;
    padding-top: 8px;
  }
  .tab.active { color: var(--primary); }
  .tab .icon { font-size: 22px; margin-bottom: 2px; }
  .tab .label { font-size: 11px; }

  .fab {
    position: absolute;
    right: 20px; bottom: 100px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 300;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,140,77,0.4);
    z-index: 11;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }

  .empty {
    text-align: center; padding: 80px 32px; color: var(--subtext);
  }
  .empty .icon { font-size: 64px; margin-bottom: 16px; }
  .empty h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* sheet */
  .sheet-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 20;
  }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    max-height: 90%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.3, 0.8, 0.4, 1);
    z-index: 21;
    display: flex; flex-direction: column;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .sheet-header .btn {
    color: var(--primary); font-size: 16px; cursor: pointer;
  }
  .sheet-header .btn.primary { font-weight: 600; }
  .sheet-header .btn.disabled { color: var(--subtext); pointer-events: none; }
  .sheet-header h2 { font-size: 17px; font-weight: 600; color: var(--text); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 20px 30px; }
  .sheet-body::-webkit-scrollbar { display: none; }
  .form-section { margin-bottom: 18px; }
  .form-label { font-size: 13px; color: var(--subtext); margin-bottom: 6px; }
  .form-input, .form-textarea {
    width: 100%; padding: 11px 14px;
    background: white; border: 1px solid rgba(0,0,0,0.06); border-radius: 10px;
    font-size: 15px; font-family: inherit;
  }
  .form-textarea { min-height: 90px; resize: none; }
  .photo-picker {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: white; border: 1px dashed rgba(0,0,0,0.15); border-radius: 10px;
    color: var(--primary); font-size: 14px;
    cursor: pointer;
  }
  .mood-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
  .mood-row::-webkit-scrollbar { display: none; }
  .mood {
    flex-shrink: 0;
    padding: 8px 10px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .mood.selected { background: rgba(255,199,140,0.4); border-color: var(--primary); }
  .mood .emoji { font-size: 26px; display: block; }
  .mood .name { font-size: 10px; color: var(--text); margin-top: 2px; display: block; }

  /* stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: white; padding: 14px; border-radius: 14px; box-shadow: var(--shadow);
  }
  .stat-card .icon { color: var(--primary); font-size: 18px; margin-bottom: 8px; }
  .stat-card .value { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-card .name { font-size: 12px; color: var(--subtext); margin-top: 2px; }
  .mood-chart {
    background: white; border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
  }
  .mood-chart h3 { font-size: 15px; margin-bottom: 12px; color: var(--text); }
  .mood-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .mood-bar .bar { flex: 1; height: 8px; background: rgba(0,0,0,0.05); border-radius: 4px; overflow: hidden; max-width: 140px; margin-left: auto; }
  .mood-bar .fill { height: 100%; background: var(--primary); border-radius: 4px; opacity: 0.75; }
  .mood-bar .count { width: 24px; text-align: right; color: var(--subtext); font-size: 11px; }

  /* profile */
  .profile-hero {
    background: white; border-radius: 16px; padding: 18px;
    display: flex; gap: 14px; align-items: center;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .app-icon {
    width: 60px; height: 60px; border-radius: 14px;
    background: linear-gradient(135deg, #FF8C4A, #FF5E8A);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 26px;
  }
  .profile-hero h3 { font-size: 18px; color: var(--text); }
  .profile-hero p { font-size: 12px; color: var(--subtext); margin-top: 2px; }
  .list-card {
    background: white; border-radius: 16px; box-shadow: var(--shadow);
    overflow: hidden; margin-bottom: 16px;
  }
  .list-card .section-title {
    padding: 12px 16px 4px; font-size: 12px; color: var(--subtext);
  }
  .list-item {
    padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(0,0,0,0.04); font-size: 15px; color: var(--text);
    cursor: pointer;
  }
  .list-item:first-of-type { border-top: none; }
  .list-item.danger { color: #d64545; }
  .list-item .right { color: var(--subtext); font-size: 14px; }

  /* detail view */
  .detail-view {
    position: absolute; inset: 0;
    background: var(--bg);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.3, 0.8, 0.4, 1);
    display: flex; flex-direction: column;
  }
  .detail-view.show { transform: translateX(0); }
  .detail-nav {
    padding: 60px 16px 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .detail-nav .back { color: var(--primary); font-size: 16px; cursor: pointer; }
  .detail-nav .trash { color: #d64545; font-size: 16px; cursor: pointer; }
  .detail-content { flex: 1; overflow-y: auto; padding: 0 20px 30px; }
  .detail-content::-webkit-scrollbar { display: none; }
  .detail-img {
    height: 280px; border-radius: 16px;
    background: linear-gradient(135deg, #FFB380, #FF8C9F);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 80px;
    margin-bottom: 20px;
  }
  .detail-title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .detail-title-row h1 { font-size: 26px; color: var(--text); flex: 1; margin-right: 12px; }
  .detail-mood { text-align: center; }
  .detail-mood .emoji { font-size: 38px; display: block; }
  .detail-mood .name { font-size: 11px; color: var(--subtext); }
  .detail-meta { font-size: 13px; color: var(--subtext); margin-bottom: 6px; }
  .detail-divider { height: 1px; background: rgba(0,0,0,0.06); margin: 14px 0; }
  .detail-note { font-size: 15px; line-height: 1.7; color: var(--text); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span style="font-size:13px;">📶 🔋</span>
  </div>

  <!-- Timeline view -->
  <div id="view-timeline" class="page">
    <div class="navbar"><h1>拾光</h1></div>
    <div class="content" id="timeline-content">
      <!-- cards injected -->
    </div>
  </div>

  <!-- Stats view -->
  <div id="view-stats" class="page" style="display:none;">
    <div class="navbar"><h1>统计</h1></div>
    <div class="content">
      <div class="stats-grid">
        <div class="stat-card"><div class="icon">📚</div><div class="value" id="s-total">0</div><div class="name">总记录</div></div>
        <div class="stat-card"><div class="icon">📅</div><div class="value" id="s-month">0</div><div class="name">本月新增</div></div>
        <div class="stat-card"><div class="icon">🖼</div><div class="value" id="s-photos">0</div><div class="name">照片数</div></div>
        <div class="stat-card"><div class="icon">🔥</div><div class="value" id="s-streak">0 天</div><div class="name">连续记录</div></div>
      </div>
      <div class="mood-chart">
        <h3>心情分布</h3>
        <div id="mood-bars"></div>
      </div>
    </div>
  </div>

  <!-- Profile view -->
  <div id="view-profile" class="page" style="display:none;">
    <div class="navbar"><h1>我的</h1></div>
    <div class="content">
      <div class="profile-hero">
        <div class="app-icon">🕐</div>
        <div>
          <h3>拾光</h3>
          <p>把每个重要时刻,都收进时光</p>
        </div>
      </div>
      <div class="list-card">
        <div class="section-title">数据</div>
        <div class="list-item" onclick="alert('原型:导出 JSON')">
          <span>📤 导出全部数据 (JSON)</span><span class="right">›</span>
        </div>
        <div class="list-item danger" onclick="if(confirm('清除全部数据?')) alert('原型:已清除')">
          <span>🗑 清除全部数据</span><span class="right">›</span>
        </div>
      </div>
      <div class="list-card">
        <div class="section-title">关于</div>
        <div class="list-item"><span>版本</span><span class="right">1.0.0</span></div>
        <div class="list-item"><span>记录数</span><span class="right" id="p-count">0</span></div>
      </div>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tabbar">
    <div class="tab active" data-tab="timeline" onclick="switchTab('timeline')">
      <div class="icon">🕐</div><div class="label">时光轴</div>
    </div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">
      <div class="icon">📊</div><div class="label">统计</div>
    </div>
    <div class="tab" data-tab="profile" onclick="switchTab('profile')">
      <div class="icon">👤</div><div class="label">我的</div>
    </div>
  </div>

  <!-- FAB -->
  <div class="fab" onclick="openSheet()">+</div>

  <!-- Add sheet -->
  <div class="sheet-mask" id="sheet-mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-header">
      <span class="btn" onclick="closeSheet()">取消</span>
      <h2>记录时刻</h2>
      <span class="btn primary" id="save-btn" onclick="saveMoment()">保存</span>
    </div>
    <div class="sheet-body">
      <div class="form-section">
        <div class="form-label">标题</div>
        <input class="form-input" id="f-title" placeholder="这一刻想叫什么?" oninput="updateSaveBtn()">
      </div>
      <div class="form-section">
        <div class="form-label">内容</div>
        <textarea class="form-textarea" id="f-note" placeholder="写点什么..."></textarea>
      </div>
      <div class="form-section">
        <div class="form-label">照片</div>
        <div class="photo-picker" onclick="alert('原型:这里会调起相册')">
          <span>🖼</span><span>选择照片(最多 9 张)</span>
        </div>
      </div>
      <div class="form-section">
        <div class="form-label">日期</div>
        <input class="form-input" type="date" id="f-date">
      </div>
      <div class="form-section">
        <div class="form-label">心情</div>
        <div class="mood-row" id="mood-row"></div>
      </div>
      <div class="form-section">
        <div class="form-label">地点(可选)</div>
        <input class="form-input" id="f-loc" placeholder="在哪里?">
      </div>
    </div>
  </div>

  <!-- Detail view -->
  <div class="detail-view" id="detail">
    <div class="detail-nav">
      <span class="back" onclick="closeDetail()">‹ 返回</span>
      <span class="trash" onclick="if(confirm('删除这一刻?')){closeDetail();}">删除</span>
    </div>
    <div class="detail-content" id="detail-content"></div>
  </div>
</div>

<script>
const MOODS = [
  {key:'happy',   emoji:'😄', name:'开心'},
  {key:'loved',   emoji:'🥰', name:'心动'},
  {key:'calm',    emoji:'😌', name:'平静'},
  {key:'excited', emoji:'🤩', name:'兴奋'},
  {key:'tired',   emoji:'😮‍💨', name:'疲惫'},
  {key:'sad',     emoji:'😢', name:'难过'},
  {key:'thinking',emoji:'🤔', name:'沉思'},
];

let moments = [
  {
    id: 1, title: '和她第一次看海',
    note: '傍晚的厦门,风很轻。她脱了鞋在沙滩上跑,浪一层一层打过来。那一刻突然觉得,以后所有的海边都想和她一起去。',
    date: '2026-09-12', mood: 'loved', location: '厦门', hasPhoto: true
  },
  {
    id: 2, title: '外婆八十大寿',
    note: '一大家子人难得聚齐,外婆坐在中间笑得眼睛都眯起来了。她说最大的心愿就是我们常回家看看。',
    date: '2026-08-28', mood: 'happy', location: '老家', hasPhoto: true
  },
  {
    id: 3, title: '拿到心仪 offer',
    note: '改了七版简历,熬了三个月夜,终于拿到了。下楼买了杯咖啡,坐在路边看行人,觉得一切值得。',
    date: '2026-07-03', mood: 'excited', location: '上海', hasPhoto: false
  },
  {
    id: 4, title: '一个人的山顶日出',
    note: '凌晨四点起床爬山,天没亮就到顶了。看到第一缕光从云里透出来的瞬间,突然就哭了。',
    date: '2026-05-20', mood: 'calm', location: '黄山', hasPhoto: true
  },
  {
    id: 5, title: '爸爸送我的第一辆车',
    note: '不是什么豪车,但是爸爸攒了很久的钱。他拍拍车顶说:以后要靠自己了。',
    date: '2026-03-08', mood: 'thinking', location: '家楼下', hasPhoto: true
  }
];

let selectedMood = 'happy';
let currentTab = 'timeline';

function moodOf(key){ return MOODS.find(m => m.key === key) || MOODS[0]; }

function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function relLabel(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso); d.setHours(0,0,0,0);
  const diff = Math.round((today - d) / (1000*60*60*24));
  if(diff === 0) return '今天';
  if(diff === 1) return '昨天';
  if(diff === 2) return '前天';
  if(diff > 0 && diff < 30) return diff + ' 天前';
  if(diff >= 30 && diff < 365) return Math.floor(diff/30) + ' 个月前';
  if(diff >= 365) return Math.floor(diff/365) + ' 年前';
  if(diff === -1) return '明天';
  return (-diff) + ' 天后';
}

function renderTimeline(){
  const c = document.getElementById('timeline-content');
  if(moments.length === 0){
    c.innerHTML = `
      <div class="empty">
        <div class="icon">🖼</div>
        <h2>还没有记录</h2>
        <p>点右下角 + 号,记下第一个重要时刻</p>
      </div>`;
    return;
  }
  const sorted = [...moments].sort((a,b) => new Date(b.date) - new Date(a.date));
  c.innerHTML = sorted.map(m => {
    const mood = moodOf(m.mood);
    return `
      <div class="card" onclick="openDetail(${m.id})">
        ${m.hasPhoto ? `<div class="img">📷</div>` : ''}
        <div class="body">
          <div class="head">
            <h3>${m.title}</h3>
            <span class="emoji">${mood.emoji}</span>
          </div>
          <div class="meta">${fmtDate(m.date)} · ${relLabel(m.date)}${m.location ? ' · 📍 ' + m.location : ''}</div>
          ${m.note ? `<div class="note">${m.note}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderStats(){
  document.getElementById('s-total').textContent = moments.length;
  const now = new Date();
  const thisMonth = moments.filter(m => {
    const d = new Date(m.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
  document.getElementById('s-month').textContent = thisMonth;
  document.getElementById('s-photos').textContent = moments.filter(m => m.hasPhoto).length;
  document.getElementById('s-streak').textContent = '3 天';

  const counts = {};
  MOODS.forEach(m => counts[m.key] = 0);
  moments.forEach(m => counts[m.mood]++);
  const maxCount = Math.max(1, ...Object.values(counts));
  document.getElementById('mood-bars').innerHTML = MOODS.map(m => `
    <div class="mood-bar">
      <span>${m.emoji}</span>
      <span style="width:32px;">${m.name}</span>
      <div class="bar"><div class="fill" style="width:${(counts[m.key]/maxCount*100).toFixed(0)}%"></div></div>
      <span class="count">${counts[m.key]}</span>
    </div>`).join('');
}

function switchTab(name){
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['timeline','stats','profile'].forEach(k => {
    document.getElementById('view-' + k).style.display = (k === name) ? '' : 'none';
  });
  if(name === 'stats') renderStats();
  if(name === 'profile') document.getElementById('p-count').textContent = moments.length;
}

function openSheet(){
  document.getElementById('sheet-mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.getElementById('f-date').valueAsDate = new Date();
  renderMoodPicker();
  updateSaveBtn();
}
function closeSheet(){
  document.getElementById('sheet-mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function renderMoodPicker(){
  document.getElementById('mood-row').innerHTML = MOODS.map(m => `
    <div class="mood ${m.key === selectedMood ? 'selected' : ''}" onclick="selectedMood='${m.key}';renderMoodPicker();">
      <span class="emoji">${m.emoji}</span>
      <span class="name">${m.name}</span>
    </div>`).join('');
}
function updateSaveBtn(){
  const title = document.getElementById('f-title').value.trim();
  document.getElementById('save-btn').classList.toggle('disabled', !title);
}
function saveMoment(){
  const title = document.getElementById('f-title').value.trim();
  if(!title) return;
  const m = {
    id: Date.now(),
    title,
    note: document.getElementById('f-note').value,
    date: document.getElementById('f-date').value || new Date().toISOString().slice(0,10),
    mood: selectedMood,
    location: document.getElementById('f-loc').value.trim(),
    hasPhoto: false
  };
  moments.unshift(m);
  closeSheet();
  renderTimeline();
  // reset
  document.getElementById('f-title').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-loc').value = '';
  selectedMood = 'happy';
  switchTab('timeline');
}

function openDetail(id){
  const m = moments.find(x => x.id === id);
  if(!m) return;
  const mood = moodOf(m.mood);
  const weekday = ['周日','周一','周二','周三','周四','周五','周六'][new Date(m.date).getDay()];
  document.getElementById('detail-content').innerHTML = `
    ${m.hasPhoto ? `<div class="detail-img">📷</div>` : ''}
    <div class="detail-title-row">
      <h1>${m.title}</h1>
      <div class="detail-mood">
        <span class="emoji">${mood.emoji}</span>
        <span class="name">${mood.name}</span>
      </div>
    </div>
    <div class="detail-meta">📅 ${fmtDate(m.date)} ${weekday} · ${relLabel(m.date)}</div>
    ${m.location ? `<div class="detail-meta">📍 ${m.location}</div>` : ''}
    ${m.note ? `<div class="detail-divider"></div><div class="detail-note">${m.note}</div>` : ''}
  `;
  document.getElementById('detail').classList.add('show');
}
function closeDetail(){
  document.getElementById('detail').classList.remove('show');
}

renderTimeline();
</script>
</body>
</html>
